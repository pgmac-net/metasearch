name: Docker Build, Push & SBoM

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read
  pull-requests: write
  id-token: write
  attestations: write
  actions: read

jobs:
  build:
    # self-hosted: builds via BuildKit over TCP to buildkitd.arc-runners.svc.cluster.local and
    # pushes to macro.int.pgmac.net:5000, neither reachable outside the homelab. See pgmac-net/homelabia#176.
    runs-on: self-hosted
    timeout-minutes: 30
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
      image-digest: ${{ steps.push.outputs.digest }}
      full-image-ref: ${{ steps.tag.outputs.full-ref }}

    steps:
      - uses: actions/checkout@v6

      - name: Compute image tag
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ "${REF_TYPE}" = "tag" ]; then
            VERSION="${REF_NAME#v}"
          elif [ "${EVENT_NAME}" = "pull_request" ]; then
            VERSION="pr-${PR_NUMBER}-${SHORT_SHA}"
          else
            VERSION="${SHORT_SHA}"
          fi
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "full-ref=macro.int.pgmac.net:5000/pg-metasearch:${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx (remote BuildKit)
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.arc-runners.svc.cluster.local:1234

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            macro.int.pgmac.net:5000/pg-metasearch:${{ steps.tag.outputs.tag }}
            macro.int.pgmac.net:5000/pg-metasearch:latest

      - name: Attest Docker image
        id: attest-image
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: macro.int.pgmac.net:5000/pg-metasearch
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false

      - name: Upload image attestation bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: docker-attestation.json
          path: ${{ steps.attest-image.outputs.bundle-path }}

      - name: Write workflow summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Docker Build Summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | \`macro.int.pgmac.net:5000/pg-metasearch:${TAG}\` |"
            if [ "${EVENT_NAME}" = "push" ]; then
              echo "| Digest | \`${DIGEST}\` |"
              echo "| Pushed | Yes |"
            else
              echo "| Pushed | No (PR build only) |"
            fi
            echo "| Build status | Success |"
            echo "| Commit | \`${COMMIT_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)

          {
            echo "<!-- docker-build-summary -->"
            echo "## Docker Build"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Status | Built (not pushed -- PR build only) |"
            echo "| Tag | \`${TAG}\` |"
            echo "| Commit | \`${SHORT_SHA}\` |"
            echo ""
            echo "> Image will be pushed to \`macro.int.pgmac.net:5000\` on merge to master."
            echo "> This comment is updated on each commit."
          } > /tmp/pr-comment.md

          COMMENT_ID=$(curl -s \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            | python3 -c 'import sys,json; cs=[str(c["id"]) for c in json.load(sys.stdin) if "docker-build-summary" in c.get("body","")]; print(cs[0] if cs else "")' \
            2>/dev/null || true)

          BODY=$(python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))' < /tmp/pr-comment.md)

          if [ -n "${COMMENT_ID}" ]; then
            curl -s -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${REPOSITORY}/issues/comments/${COMMENT_ID}" \
              -d "{\"body\": ${BODY}}"
          else
            curl -s -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -d "{\"body\": ${BODY}}"
          fi

  sbom:
    # Shared image SBoM (pg-actions#202): trivy CycloneDX by digest, uploaded to Dependency-Track as
    # the image project macro.int.pgmac.net:5000/pg-metasearch / <tag>@<digest>, attested with the
    # SBoM (public repo). Release builds only: master builds are never deployed, and a project
    # version per merge would bury the released versions.
    needs: [build]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    uses: pgmac-net/pg-actions/.github/workflows/image-sbom.yml@8d3f236e838c0d645c3c21e79e912f862283f853 # main
    with:
      image: macro.int.pgmac.net:5000/pg-metasearch
      digest: ${{ needs.build.outputs.image-digest }}
      tag: ${{ needs.build.outputs.image-tag }}
      insecure-registry: true
    permissions:
      id-token: write
      attestations: write
      contents: read
    secrets:
      DT_HOST: ${{ secrets.DT_HOST }}
      DT_APIKEY: ${{ secrets.DT_APIKEY }}
